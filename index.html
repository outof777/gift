<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person ❤️</title>
    <!-- কনফেটি লাইব্রেরি -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            position: relative;
        }

        /* সিনেমাটিক ডার্ক ওভারলে */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        /* ব্যাকগ্রাউন্ড ফ্লোটিং কিউট লাভ অ্যানিমেশন */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            color: rgba(255, 71, 87, 0.6);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
            bottom: -20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-105vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .main-box {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 600px;
            padding: 20px;
        }

        /* ইমেজ ফ্রেম - ফিক্সড সাইজ এবং পারফেক্ট ফিট */
        .image-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #ff4757;
            box-shadow: 0 0 35px rgba(255, 71, 87, 0.6);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: cinematicZoomIn 3s ease-out forwards;
            animation-delay: 0.3s;
            background-color: #1a1a1a;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            animation: slowKenBurns 10s infinite alternate;
        }

        /* টেক্সট কন্টেন্ট */
        .text-content {
            margin-top: 25px;
            opacity: 0;
            animation: fadeInText 2s ease-in forwards;
            animation-delay: 2.8s;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 48px;
            color: #ff4757;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }
            100% { text-shadow: 0 0 25px rgba(255, 71, 87, 0.9); }
        }

        p {
            font-size: 15px;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 25px auto;
            font-weight: 300;
            color: #f1f1f1;
        }

        /* বাটন গ্রুপ */
        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            position: relative;
            opacity: 0;
            animation: fadeInText 1s ease-in forwards;
            animation-delay: 4s;
            width: 100%;
            min-height: 60px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.4);
            z-index: 10;
        }

        .btn-yes:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 15px 30px rgba(255, 71, 87, 0.7);
        }

        /* সুপার ফাস্ট পালানো বাটন (No Button) */
        .btn-no {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            transition: top 0.1s ease, left 0.1s ease;
            z-index: 100;
        }

        /* ====== এনিমেশন কী-ফ্রেম ====== */
        @keyframes cinematicZoomIn {
            0% {
                transform: scale(0.1) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                width: 240px;
                height: 240px;
                opacity: 1;
                box-shadow: 0 0 50px rgba(255, 71, 87, 0.7);
            }
        }

        @keyframes slowKenBurns {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            @keyframes cinematicZoomIn {
                100% { transform: scale(1); width: 190px; height: 190px; }
            }
            h1 { font-size: 38px; }
            p { font-size: 13px; padding: 0 10px; }
        }
    </style>
</head>
<body>
    
    <div class="overlay"></div>

    <!-- ব্যাকগ্রাউন্ডে কিউট ফ্লোটিং লাভ অ্যানিমেশন কন্টেইনার -->
    <div class="floating-hearts" id="heartContainer"></div>

    <!-- ব্যাকগ্রাউন্ডে মিষ্টি রোমান্টিক মিউজিক টোন (ফ্রি রিলায়েবল সিডিএন সোর্স) -->
    <audio id="bgMusic" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/romantic_lofi.ogg" type="audio/ogg">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=romantic-cute-love-111082.mp3" type="audio/mpeg">
    </audio>

    <div class="main-box">
        <!-- ইমেজ ফ্রেম (ORB ব্লকিং এড়াতে সঠিক হ্যান্ডলিং) -->
        <div class="image-frame">
            <img src="https://raw.githubusercontent.com/nahid-mahmud555/nahid-mahmud555/main/ChatGPT%20Image%20Aug%2013%2C%202026%2C%2010_46_43%20PM.png" alt="Special Person" crossorigin="anonymous" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500&auto=format&fit=crop'">
        </div>

        <!-- সুদৃশ্য কথা ও আকুতি -->
        <div class="text-content">
            <h1>I am really sorry!</h1>
            <p>জানি আমার ওপর অনেক অভিমান করে আছো, রাগ করে কথা কম বলছ... বিশ্বাস করো, তোমার এই সুন্দর মুখটাতে একটু কান্নার বা রাগের ছায়া দেখলে আমার নিজের ভেতরটা কেমন যেন ভেঙে যায়। দুনিয়ার সব সুখ একপাশে আর তোমার এই মিষ্টি হাসিটা একপাশে! প্লিজ সব রাগ পানি করে ফেলো না সোনা?</p>
            
            <!-- বাটন সেকশন -->
            <div class="btn-group" id="btnContainer">
                <button class="btn btn-yes" onclick="acceptApology()">মাফ করে দিলাম ❤️</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" ontouchstart="moveButton()" onclick="threatWarning()">এখনও রাগ আছি 😾</button>
            </div>
        </div>
    </div>

    <script>
        // ব্যাকগ্রাউন্ডে নিজে নিজেই ফ্লোটিং লাভ হার্ট জেনারেট করার ফাংশন
        function createHeart() {
            const heartContainer = document.getElementById('heartContainer');
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            // রেন্ডম পজিশন ও সাইজ
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            heartContainer.appendChild(heart);
            
            // অ্যানিমেশন শেষ হলে ডিলিট করে দেওয়া
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);

        // পেজে ক্লিক করলেই ব্যাকগ্রাউন্ড মিউজিক প্লে করার হ্যান্ডলার
        window.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play().catch(e => console.log("Audio play blocked"));
            }
        }, { once: true });

        // "No" বাটনটি মাউস বা আঙুল লাগলেই সুপার ফাস্ট এদিক-সেদিক পালিয়ে যাবে
        const noBtn = document.getElementById('noBtn');

        function moveButton() {
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // মায়ার মাইরের হুমকি পপআপ
        function threatWarning() {
            alert("খবরদার! 😾 রাগ করা এক্কেবারে নিষেধ! বেশি বাড়াবাড়ি করলে কিন্তু সোজা মায়ার মাইর দিয়ে একদম ভূত নামিয়ে দেব! তাড়াতাড়ি 'মাফ করে দিলাম' বাটনটায় ক্লিক করো! 😉");
        }

        // ক্ষমা করে দিলে যা হবে
        function acceptApology() {
            confetti({
                particleCount: 200,
                spread: 100,
                origin: { y: 0.6 }
            });

            document.querySelector('.text-content h1').innerText = "Yay! Thank You! 🥰";
            document.querySelector('.text-content p').innerText = "আমি জানতাম তুমি আমার ওপর বেশিক্ষণ রাগ করে থাকতে পারবে না! Promise আর কখনো তোমাকে কষ্ট দেব না। You are my whole world! ✨❤️";
            document.getElementById('btnContainer').style.display = 'none';
        }
    </script>
</body>
</html>
